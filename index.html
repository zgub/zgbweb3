<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark light" />
    <title>zgb — big numbers, small numbers</title>
    <meta name="description"
        content="Interactive explainers for curious kids: powers of ten, the energy ladder from a molecule to the ISS, dice and the bell curve, and more." />

    <link data-trunk rel="rust" href="crates/app/Cargo.toml" data-bin="zgbweb" data-wasm-opt="z" />

    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #1b1b1b; /* matches egui dark panel fill to avoid a white flash */
            color: #ddd;
            font-family: system-ui, sans-serif;
        }
        body { display: flex; flex-direction: column; }

        /* Reserved for a future ad unit. Ads cannot live inside the canvas:
           ad networks inject DOM/iframes. Hidden until ads are switched on (DECISIONS D-007). */
        #ad-top { display: none; flex: 0 0 auto; min-height: 90px; text-align: center; }

        #zgb_canvas { flex: 1 1 auto; width: 100%; min-height: 0; display: block; }

        #loading {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; opacity: .8;
        }
    </style>
</head>
<body>
    <aside id="ad-top" aria-label="Advertisement"></aside>
    <canvas id="zgb_canvas"></canvas>
    <div id="loading">Loading…</div>
    <noscript>
        This site is a set of interactive science and maths experiments and needs JavaScript and WebAssembly.
    </noscript>
</body>
</html>
