<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark light" />
    <title>zgub.net</title>
    <!-- Kept for link previews when someone shares a link (D-021). -->
    <meta name="description"
        content="zgub's site: hobby projects, games, things I am learning and things I can explain. Interactive, in your browser." />
    <!-- Shared by word and links, not by crawlers (D-021). The server sends the same as X-Robots-Tag. -->
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />

    <link data-trunk rel="rust" href="crates/app/Cargo.toml" data-bin="zgbweb3" data-wasm-opt="z" />

    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #1b1b1b; /* egui's dark panel fill, avoids a flash before the app paints */
            color: #d2d2d2;
            font-family: system-ui, sans-serif;
        }
        body { display: flex; flex-direction: column; }

        /* Reserved for a future ad unit. Ads cannot live inside the canvas:
           ad networks inject DOM/iframes. Hidden until ads are switched on (DECISIONS D-007). */
        #ad-top { display: none; flex: 0 0 auto; min-height: 90px; text-align: center; }

        #zgb_canvas { flex: 1 1 auto; width: 100%; min-height: 0; display: block; }

        #loading {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; opacity: .8;
        }
    </style>
</head>
<body>
    <aside id="ad-top" aria-label="Advertisement"></aside>
    <canvas id="zgb_canvas"></canvas>
    <div id="loading">Loading…</div>
    <noscript>
        zgub.net is an interactive site and needs JavaScript and WebAssembly.
    </noscript>
</body>
</html>
