[package]
name = "zgbweb3-server"
description = "Thin axum server for zgub.net: serves the built site with crawler-refusing headers; /api reserved for later (DECISIONS D-032)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
