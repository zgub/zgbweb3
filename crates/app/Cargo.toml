[package]
name = "zgbweb3"
description = "zgub.net — personal site: projects, games, learning notes and interactive explainers. egui, runs in the browser via wasm."
version.workspace = true
edition.workspace = true
license.workspace = true

# Plain library + binary, as in the eframe template. Trunk builds the binary
# for the web (index.html: data-bin="zgbweb3"); a cdylib here would be a second
# wasm artifact with the same name and trunk refuses to pick one.
[lib]

[[bin]]
name = "zgbweb3"
path = "src/main.rs"

[dependencies]
sims.workspace = true
content.workspace = true
eframe.workspace = true
egui.workspace = true
serde.workspace = true
log.workspace = true
rand.workspace = true
fluent-bundle = "0.16"
unic-langid = "0.9"

# native: windowing + logging
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
env_logger = "0.11"

# web
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlCanvasElement", "Element", "Location", "Storage", "Navigator",
] }
# Note: no getrandom. rand is used with seeded SmallRng only (see DECISIONS D-009).

[dev-dependencies]
fluent-syntax = "0.12"
# Reads the font files' character maps in a test: egui's own has_glyph() reports
# false for glyphs that share a font with the replacement character.
skrifa = "0.44"
